<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>合同排版打印</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6f7; color: #1f2329; height: 100vh; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e6eb; display: flex; align-items: center; gap: 8px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .search { flex: 1; padding: 6px 12px; border: 1px solid #e5e6eb; border-radius: 6px; font-size: 13px; outline: none; }
    .search:focus { border-color: #3370ff; }
    .record-list { flex: 1; overflow-y: auto; padding: 8px; }
    .record-item { padding: 10px 12px; background: #fff; border-radius: 8px; margin-bottom: 6px; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
    .record-item:hover { border-color: #3370ff; background: #f0f5ff; }
    .record-item.active { border-color: #3370ff; background: #e8f0ff; }
    .record-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .record-meta { font-size: 12px; color: #8f959e; display: flex; gap: 12px; }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; }
    .tag-lease { background: #e8f7ee; color: #00b42a; }
    .tag-manage { background: #fff7e8; color: #ff7d00; }
    .tag-done { background: #e8f3ff; color: #3370ff; }
    .tag-pending { background: #f2f3f5; color: #8f959e; }
    .detail { padding: 16px; background: #fff; border-top: 1px solid #e5e6eb; max-height: 45vh; overflow-y: auto; }
    .detail h2 { font-size: 15px; margin-bottom: 12px; }
    .detail-row { display: flex; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #f2f3f5; }
    .detail-label { width: 100px; color: #8f959e; flex-shrink: 0; }
    .detail-value { flex: 1; word-break: break-all; }
    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: #3370ff; color: #fff; }
    .btn-primary:hover { background: #2860e1; }
    .btn-primary:disabled { background: #a9c4ff; cursor: not-allowed; }
    .btn-secondary { background: #f2f3f5; color: #1f2329; }
    .btn-secondary:hover { background: #e5e6eb; }
    .empty { text-align: center; padding: 40px 20px; color: #8f959e; font-size: 13px; }
    .loading { text-align: center; padding: 20px; color: #8f959e; }
    .status-msg { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-top: 8px; }
    .status-success { background: #e8f7ee; color: #00b42a; }
    .status-error { background: #ffece8; color: #f53f3f; }
  </style>
  <script type="module" crossorigin src="./assets/index-Bbifb9Vv.js"></script>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>合同排版打印</h1>
      <input class="search" id="search" placeholder="搜索企业名称..." />
    </div>
    <div class="record-list" id="recordList">
      <div class="loading">加载中...</div>
    </div>
    <div class="detail" id="detail" style="display:none;"></div>
  </div>
</body>
</html>
